# Root entry point for IMD repository import. Keep compiler settings aligned with contracts/foundry.toml.
[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[fuzz]
runs = 128
